<html lang="ru">
<head>
<meta charset="utf-8">

<title>WRENCHWORLD — v4.5m</title>
<link rel="stylesheet" href="css/style.css?v=mobile-1">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="logo" data-a="menu" title="Меню (Esc)">WRENCH<b>WORLD</b></div>
    <div class="tb" id="tDate"></div>
    <div class="tb clock" id="tClock"></div>
    <div class="tb" id="tWeather"></div>
    <div class="tb stage" id="tStage" data-a="panel" data-p="goals"></div>
    <div class="sp"></div>
    <div class="tb rep" id="tRep" data-a="panel" data-p="log"></div>
    <div class="tb money" id="tMoney" data-a="panel" data-p="fin"></div>
    <div class="speed" id="tSpeed">
      <button data-a="speed" data-v="0" title="Пауза (Пробел)">❚❚</button>
      <button data-a="speed" data-v="1" title="×1 (Q)">▶</button>
      <button data-a="speed" data-v="8" title="×8 (W)">×8</button>
      <button data-a="speed" data-v="16" title="×16 (E)">×16</button>
      <button data-a="speed" data-v="32" title="×32 (R)">×32</button>
    </div>
    <button class="ico" data-a="mute" id="bMute" title="Звук">🔊</button>
    <button class="ico" data-a="menu" title="Меню">☰</button>
  </header>
  <div id="radio"><span class="rl">📻 WRNC 98.7</span><div class="rt"><span id="radioText"></span></div></div>
  <main id="stage">
    <canvas id="world"></canvas>
    <aside id="panel" class="hidden"></aside>
    <aside id="alerts"></aside>
    <div id="toasts"></div>
    <div id="quest" class="hidden"></div>
    <div id="ovl"></div>
    <div id="pops" class="hidden"></div>
    <div id="hint"></div>
  </main>
  <nav id="nav"></nav>
</div>
<div id="tip" class="hidden"></div>
<div id="modal" class="hidden"><div id="modalBox"></div></div>

<script src="js/waste.js"></script>

<script src="js/render.js"></script>
<script src="js/audio.js"></script>
